[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "span-units"
version = "0.1.0"
description = "Exact UTF-8, UTF-16 and code-point annotation span migration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing",
]

[project.urls]
Repository = "https://github.com/KanadeK/span-units"
Issues = "https://github.com/KanadeK/span-units/issues"

[project.scripts]
span-units = "span_units.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
